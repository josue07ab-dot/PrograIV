<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo | TecnoAccesorios</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<!-- Responsable: Bianka Martínez Gamboa -->
<body data-page="catalog">

  <div id="site-header"></div>

  <main id="main-content" class="container section">
    <h1 class="section-title">Catálogo</h1>

    <!-- Búsqueda y filtro. Avance 2: method="get" action="/catalog" -->
    <form id="search-form" class="row g-3 align-items-end mb-4" role="search" novalidate>
      <div class="col-12 col-md-6">
        <label for="search-input" class="form-label">Buscar por nombre</label>
        <input type="search" id="search-input" name="q" class="form-control"
               placeholder="Ej.: cargador, mouse, audífonos" maxlength="60" autocomplete="off">
      </div>
      <div class="col-12 col-sm-8 col-md-4">
        <label for="category-filter" class="form-label">Categoría</label>
        <select id="category-filter" name="category" class="form-select">
          <option value="">Todas las categorías</option>
          <!-- js/catalog.js agrega las opciones desde CATEGORIES -->
        </select>
      </div>
      <div class="col-12 col-sm-4 col-md-2">
        <button type="button" id="btn-clear" class="btn btn-outline-main w-100">Limpiar</button>
      </div>
    </form>

    <!-- Cantidad de resultados (se anuncia a lectores de pantalla) -->
    <p id="results-summary" class="text-body-secondary" aria-live="polite"></p>

    <!-- Mensaje de búsqueda sin resultados -->
    <div id="messages" aria-live="polite"></div>

    <!-- Avance 2: {% for p in products %}{% include "catalog/_product_card.html" %}{% endfor %} -->
    <div id="product-list" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-4"></div>

    <!-- Créditos de las fotos (js/catalog.js llena la lista desde data.js) -->
    <details class="image-credits mt-5">
      <summary>Créditos de las imágenes</summary>
      <ul id="image-credits" class="small mt-2"></ul>
    </details>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/catalog.js"></script>
</body>
</html>
