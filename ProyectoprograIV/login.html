<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar | TecnoAccesorios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<!-- Responsable: Andrea Córdoba Sevilla -->
<body data-page="login">
  <div id="site-header"></div>
  <main id="main-content" class="container section">
    <div class="auth-card">
      <div class="auth-icon" aria-hidden="true">↗</div>
      <p class="eyebrow">Qué gusto tenerte de vuelta</p>
      <h1 class="section-title">Ingresar</h1>
      <p class="text-secondary">Inicia sesión en la demostración de TecnoAccesorios.</p>
      <div id="messages" aria-live="polite"></div>
      <form id="login-form" novalidate>
        <div class="mb-3">
          <label for="login-email" class="form-label">Correo electrónico</label>
          <input id="login-email" name="email" type="email" class="form-control" autocomplete="username" required>
          <div class="invalid-feedback">Escribe un correo electrónico válido.</div>
        </div>
        <div class="mb-3">
          <label for="login-password" class="form-label">Contraseña</label>
          <input id="login-password" name="password" type="password" class="form-control" autocomplete="current-password" required>
          <div class="invalid-feedback">Escribe tu contraseña.</div>
        </div>
        <button type="submit" class="btn btn-main w-100 py-2">Ingresar</button>
      </form>
      <p class="auth-switch mb-0">¿Todavía no tienes cuenta? <a href="register.html">Crear una cuenta</a></p>
      <p class="small text-secondary mt-3 mb-0">Acceso simulado para el proyecto. No se guarda la contraseña.</p>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script><script src="js/common.js"></script><script src="js/layout.js"></script><script src="js/login.js"></script>
</body>
</html>
