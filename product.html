<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del producto | TecnoAccesorios</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<!-- Responsable: Bianka Martínez Gamboa -->
<body data-page="product">

  <div id="site-header"></div>

  <main id="main-content" class="container section">

    <nav aria-label="Ruta de navegación">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="index.html">Inicio</a></li>
        <li class="breadcrumb-item"><a href="catalog.html">Catálogo</a></li>
        <li class="breadcrumb-item active" aria-current="page" id="breadcrumb-product">Producto</li>
      </ol>
    </nav>

    <!-- Si el id no existe se muestra "no encontrado" -->
    <div id="not-found" class="d-none empty-state">
      <p class="empty-state-icon" aria-hidden="true">🔍</p>
      <h1 class="h3">Producto no encontrado</h1>
      <p>El producto que buscás no existe o ya no está disponible.</p>
      <a href="catalog.html" class="btn btn-main">Volver al catálogo</a>
    </div>

    <article id="product-detail" class="row g-4 d-none">
      <div class="col-12 col-md-6">
        <figure class="m-0">
          <img id="detail-image" src="img/placeholder.svg" alt="" class="product-image">

          <!-- Miniaturas: js/product.js las dibuja solo si el producto tiene 2 o más fotos -->
          <div id="detail-thumbs" class="product-thumbs d-none" role="group" aria-label="Fotos del producto"></div>

          <!-- Crédito de la foto que se está viendo (autor y licencia) -->
          <figcaption id="detail-image-credit" class="image-credit"></figcaption>
        </figure>
      </div>

      <div class="col-12 col-md-6">
        <span id="detail-brand" class="brand-label"></span>
        <h1 id="detail-name" class="h2 mt-1"></h1>
        <p class="mb-2">
          <a id="detail-category" href="#" class="badge text-bg-light border text-decoration-none"></a>
          <span id="detail-availability" class="badge ms-1"></span>
        </p>
        <p id="detail-price" class="price fs-2 my-3"></p>
        <p id="detail-description"></p>

        <!-- DATO PARTICULAR DEL GRUPO 1: marca y compatibilidad -->
        <dl class="spec-sheet">
          <dt>Marca</dt>
          <dd id="detail-brand-spec"></dd>
          <dt>Compatibilidad</dt>
          <dd id="detail-compatibility"></dd>
          <dt>Existencias</dt>
          <dd id="detail-stock"></dd>
        </dl>

        <div id="messages" aria-live="polite"></div>

        <!-- Avance 2: method="post" action="/cart/add" con token CSRF -->
        <form id="add-form" class="row g-2 align-items-end" novalidate>
          <input type="hidden" name="product_id" id="product-id">
          <div class="col-5 col-sm-4">
            <label for="quantity" class="form-label">Cantidad</label>
            <input type="number" id="quantity" name="quantity" class="form-control"
                   value="1" min="1" step="1" required aria-describedby="quantity-help">
          </div>
          <div class="col-7 col-sm-8">
            <button type="submit" id="btn-add" class="btn btn-main w-100">Agregar al carrito</button>
          </div>
          <div id="quantity-help" class="form-text col-12"></div>
        </form>

        <a href="catalog.html" class="d-inline-block mt-3">← Seguir comprando</a>
      </div>
    </article>

    <!-- Productos de la misma categoría -->
    <section id="related-section" class="mt-5 d-none" aria-labelledby="related-title">
      <h2 id="related-title" class="section-title h4">También te puede interesar</h2>
      <div id="related-list" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4"></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/product.js"></script>
</body>
</html>
