<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOMBRE DE LA PÁGINA | TecnoAccesorios</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

<!-- PASOS PARA CREAR UNA PÁGINA NUEVA:
     1) Copiar este archivo y renombrarlo (ej.: contact.html).
     2) Cambiar el <title>.
     3) Cambiar data-page: home | catalog | product | cart | checkout |
        contact | register | login | account | admin  (marca el menú activo).
     4) Escribir el contenido dentro de <main>.
     5) Crear su JS en la carpeta js/ con el mismo nombre (ej.: js/contact.js)
        y cambiar la última etiqueta <script>.
     6) Cambiar el comentario "Responsable".
     Responsable: NOMBRE -->
<body data-page="NOMBRE">

  <div id="site-header"></div>

  <main id="main-content" class="container section">
    <h1 class="section-title">Título de la página</h1>

    <!-- Lugar para mensajes: showAlert("messages", "danger", "texto") -->
    <div id="messages" aria-live="polite"></div>

    <!-- Contenido de la página -->

  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/layout.js"></script>
  <!-- Su script propio -->
  <script src="js/NOMBRE.js"></script>
</body>
</html>
